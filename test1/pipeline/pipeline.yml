
trigger:
  - main

pool:
  name: Default

variables:
  terraformDirectory: '$(Build.SourcesDirectory)/app1/Region/EstUS'
  serviceConnection: 'azure-cicd'

stages:
  - stage: Init
    jobs:
      - job: TerraformInit
        steps:
          - checkout: self
          - bash: |
              set -e
              terraform version
              test -d /mnt/statefile
              terraform init -input=false
            displayName: Terraform Init
            workingDirectory: '$(terraformDirectory)'

  - stage: Validate
    dependsOn: Init
    jobs:
      - job: TerraformValidate
        steps:
          - checkout: self
          - bash: |
              set -e
              terraform init -input=false
              terraform validate
            displayName: Terraform Validate
            workingDirectory: '$(terraformDirectory)'

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        steps:
          - checkout: self
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(terraformDirectory)'
          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(terraformDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-input=false'

  - stage: Apply
    dependsOn: Plan
    jobs:
      - job: TerraformApply
        steps:
          - checkout: self
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(terraformDirectory)'
          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: '$(terraformDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-input=false -auto-approve'
