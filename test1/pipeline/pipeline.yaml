
trigger:
  - main

pool:
  name: Default

variables:
  terraformDirectory: '$(Build.SourcesDirectory)/test1/app1/Region/EstUs'
  serviceConnection: 'azure-cicd'

stages:

  # ---------------- INIT STAGE ----------------
  - stage: Init
    displayName: Terraform Init
    jobs:
      - job: TerraformInit
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform version
              terraform init -input=false
            displayName: Terraform Init
            workingDirectory: '$(terraformDirectory)'

  # ---------------- VALIDATE STAGE ----------------
  - stage: Validate
    displayName: Terraform Validate
    dependsOn: Init
    jobs:
      - job: TerraformValidate
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform init -input=false
              terraform validate
            displayName: Terraform Validate
            workingDirectory: '$(terraformDirectory)'

  # ---------------- PLAN STAGE ----------------
  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform init -input=false
              terraform plan -input=false -var-file="env.tfvars"
 #             export ARM_USE_CLI=true
  #            terraform plan -input=false
            displayName: Terraform Plan
            workingDirectory: '$(terraformDirectory)'
            env:
              ARM_USE_CLI: true

  # ---------------- APPLY STAGE ----------------
  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    jobs:
      - job: TerraformApply
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform init -input=false
              terraform apply -input=false -auto-approve -var-file="env.tfvars"
 #             export ARM_USE_CLI=true
 #             terraform apply -input=false -auto-approve
            displayName: Terraform Apply
            workingDirectory: '$(terraformDirectory)'
            env:
              ARM_USE_CLI: true
