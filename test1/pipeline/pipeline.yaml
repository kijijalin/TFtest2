
trigger:
  - main

pool:
  name: Default

variables:
  terraformDirectory: '$(Build.SourcesDirectory)/test1/app1/Region/EstUs'
  serviceConnection: 'azure-cicd'

stages:

  # INIT
  - stage: Init
    displayName: Terraform Init
    jobs:
      - job: TerraformInit
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform version
              terraform init -input=false
            displayName: Terraform Init
            workingDirectory: '$(terraformDirectory)'

  # VALIDATE
  - stage: Validate
    displayName: Terraform Validate
    dependsOn: Init
    jobs:
      - job: TerraformValidate
        steps:
          - checkout: self

          - bash: |
              set -e
              terraform init -input=false
              terraform validate
            displayName: Terraform Validate
            workingDirectory: '$(terraformDirectory)'

  # PLAN
  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                set -e
                terraform init -input=false
                terraform plan -input=false -var-file="env.tfvars"

  
  # APPLY
  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: Terraform Apply
        environment: apply
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Terraform Apply
                  inputs:
                    azureSubscription: '$(serviceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: '$(terraformDirectory)'
                    inlineScript: |
                      set -e
                      terraform init -input=false
                      terraform apply -input=false -auto-approve -var-file="env.tfvars"
